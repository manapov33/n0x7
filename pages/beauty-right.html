<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>beauty-right</title>
<link rel="stylesheet" href="_base.css">
<style>
  .site { --cream: #f7f2eb; --brown: #3d3029; --rose: #b98a80; color: var(--brown); background: var(--cream); }
  .w-caption { left: var(--w-margin); width: 450px; top: 196px; }
  .w-phone { right: var(--w-margin); width: 500px; top: 196px; height: 1196px; }

  .bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 72px;
    margin-top: 74px;
    padding: 0 30px;
    font: 500 44px/1 'Cormorant', serif;
  }
  .bar .back, .bar .bag { font: 500 40px/1 'Manrope', sans-serif; width: 40px; }
  .bar .bag { text-align: right; }
  .photo {
    height: 506px;
    margin: 6px 18px 0;
    border-radius: 30px;
    background: #efe6dc url('../assets/images/beauty-detail.jpg') center 42% / cover no-repeat;
  }
  .info { padding: 26px 30px 0; }
  .kind { font: 500 36px/1 'Manrope', sans-serif; color: #75665d; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; white-space: nowrap; }
  .rate { font: 500 36px/1 'Manrope', sans-serif; color: var(--rose); }
  .name { margin-top: 12px; font: 500 74px/1 'Cormorant', serif; letter-spacing: -0.01em; }
  .price { font: 600 44px/1 'Manrope', sans-serif; }
  .strip { display: flex; gap: 14px; margin-top: 26px; }
  .strip span {
    flex: 1;
    height: 118px;
    border-radius: 18px;
    background: #efe6dc url('../assets/images/beauty-texture.jpg') no-repeat;
  }
  .strip .s1 { background-size: 150% auto; background-position: 20% 60%; box-shadow: 0 0 0 4px var(--cream), 0 0 0 6px var(--brown); }
  .strip .s2 { background-size: 260% auto; background-position: 50% 52%; }
  .strip .s3 { background-image: url('../assets/images/beauty-detail.jpg'); background-size: 230% auto; background-position: 84% 64%; }
  .cart {
    margin: 28px 18px 0;
    padding: 30px 0;
    border-radius: 60px;
    background: var(--brown);
    color: var(--cream);
    text-align: center;
    font: 600 40px/1 'Manrope', sans-serif;
  }
</style>
</head>
<body class="work is-right">
  <header class="w-head"><span>Косметика</span><span>2026</span></header>

  <div class="w-caption">
    <span class="w-tag">концепт</span>
    <h1 class="w-title">Лилея</h1>
    <p class="w-task">Интернет-магазин натуральной косметики</p>
    <dl class="w-specs">
      <div><dt>Экраны</dt><dd>Главная и карточка товара</dd></div>
      <div><dt>Шрифты</dt><dd>Cormorant, Manrope</dd></div>
      <div>
        <dt>Палитра</dt>
        <dd class="w-swatches">
          <span style="background:#f7f2eb"></span><span style="background:#e8d5cd"></span><span style="background:#b98a80"></span><span style="background:#c3c8b0"></span><span style="background:#3d3029"></span>
        </dd>
      </div>
    </dl>
  </div>

  <div class="w-phone">
    <div class="w-phone-screen site">
      <div class="bar"><span class="back"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></span><span>Лилея</span><span class="bag"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span></div>
      <div class="photo"></div>
      <div class="info">
        <div class="kind">Дневной крем · 50 мл</div>
        <div class="name">Лепесток</div>
        <div class="row"><span class="price">2 890 ₽</span><span class="rate"><svg class="ico star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg> 4,9</span></div>
        <div class="strip"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
      </div>
      <div class="cart">В корзину</div>
    </div>
  </div>

  <footer class="w-foot"><span class="w-note"><b>02</b> · Карточка товара</span><span class="w-folio">05</span></footer>
</body>
</html>
